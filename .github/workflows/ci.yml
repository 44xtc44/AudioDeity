name: Continuous Integration

on:
  pull_request:
    branches: [ main, playground ]
  push:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-level: '20' # Change to match your preferred Node version
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npx prettier --check .

      - name: Lint code (ESLint)
        run: npm run lint

      # Uncomment the block below if you have unit tests set up!
      # - name: Run unit tests
      #   run: npm test
