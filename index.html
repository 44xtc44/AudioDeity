<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- 1. Default: modern Browser brands -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- 2. Fallback: PNG for Safari (iOS/macOS) and older browsers -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <!-- 3. Legacy Fallback: ICO for very old browsers (IE) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <!-- 4. Apple Touch Icon: Required for iOS Home Screen (PNG only) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>audiodeity_simple</title>
  </head>
